[project]
name = "book-buddy"
version = "0.1.0"
description = "Spoiler-safe RAG reading companion"
readme = "README.md"
# qdrant-client requires numpy<2.3 on 3.10 and numpy>=2.3 on 3.11+, so the
# project is pinned to the 3.10 line where the two dependency ranges agree.
requires-python = ">=3.10,<3.11"

# Direct dependencies ONLY -- everything else is a transitive dep of these.
# Verified by grepping every import in src/, scripts/ and tests/.
#
#   httpx        OpenRouter chat + embeddings (both raw HTTP)
#   pydantic     Book, Section, Chunk, Hit, RagAnswer, StructureArtifact
#   qdrant-client  hybrid dense + BM25-sparse store; hosts the spoiler gate
#   tiktoken     token counting for the chunk budget
#   python-dotenv  reads OPENROUTER_API_KEY from ~/.hermes/.env
#   regex        heading/pattern matching in book.py, structure.py, rag.py
#   rapidfuzz    fuzzy matching in progress.py ("chapter 3" resolution)
#
# Removed, with the reason:
#   fastapi / uvicorn / starlette / motor / openrouter / websockets
#       -- the webserver and Mongo layer are gone; the CLI + library is the
#          whole product. See tests/test_spoiler_gate.py.
#   numpy / semchunk / mpire / multiprocess / tqdm / requests / pyyaml
#       -- only the retired src/index/ RAG used these.
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "qdrant-client==1.19.1",
    "tiktoken==0.12.0",
    "python-dotenv==1.2.1",
    "regex==2026.1.15",
    "rapidfuzz==3.14.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "black==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live OpenRouter calls must be opt-in so `pytest` never spends money:
#   BOOKBUDDY_LIVE=1 uv run pytest -m live
markers = ["live: makes real OpenRouter calls"]
filterwarnings = ["ignore::UserWarning"]