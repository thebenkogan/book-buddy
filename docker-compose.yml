services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=bookdb
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  client:
    build:
      context: ./src/client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mongo-data:
